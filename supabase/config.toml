# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "pncl"

# Audience submissions are anonymous; presenter validates the existing admin
# session inside its handler (supports both legacy and modern Supabase keys).
[functions.summit-submit]
verify_jwt = false

[functions.summit-presenter]
verify_jwt = false

# Validates single-use cron tokens inside the handler.
[functions.summit-worker]
verify_jwt = false

